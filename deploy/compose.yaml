# Production-shape deployment for apt-cacher-ultra.
#
# network_mode: host is deliberate. On the default bridge network Docker SNATs
# every client connection, so the cache sees its own gateway address instead of
# the machine that asked for a suite — the status page's per-client and hot-path
# views collapse into one client, and IP-based access control becomes useless.
# Host mode keeps :3142 and :6789 bound by the container with real source
# addresses, and needs no published ports.
#
# The cache directory must live on a data disk. On 172.31.0.3 that is
# /data/harbor (14T, /dev/nvme0n1); the 877G root disk is 73% full and the cache
# never expires entries (gc.url_path_ttl = "0s").
#
# Settings are read from .env next to this file (see .env.example).

services:
  apt-cacher-ultra:
    image: ${ACU_IMAGE:-ghcr.io/yzh-7/apt-cacher-ultra:latest}
    container_name: ${ACU_CONTAINER_NAME:-apt-cacher-ultra}
    restart: unless-stopped
    network_mode: host

    # Matches the uid/gid the upstream .deb creates and the ownership of an
    # existing cache directory, so no chown is needed when switching over.
    user: "${ACU_UID:-113}:${ACU_GID:-112}"

    volumes:
      # SQLite database + blob pool + the MITM CA under <dir>/ca. This directory
      # IS the service's state: losing it means losing the cache and generating
      # a new CA that no client trusts.
      - ${ACU_CACHE_DIR:-/data/harbor/apt-cacher-ultra}:/var/lib/apt-cacher-ultra

      # Generated by deploy/make-container-config.sh, reviewed with diff.
      - ${ACU_CONFIG:-/etc/apt-cacher-ultra/config.container.toml}:/etc/apt-cacher-ultra/config.toml:ro

      # Signing keys the daemon verifies InRelease against. Missing mounts here
      # look like a working service until every adoption fails with gpg_failed.
      - /usr/share/keyrings:/keyrings/usr-share-keyrings:ro
      - /etc/apt/trusted.gpg.d:/keyrings/etc-apt-trusted.gpg.d:ro
      - /etc/apt/keyrings:/keyrings/etc-apt-keyrings:ro

    # Everything writable is on the cache volume, so the rest can be read-only.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024

    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

    # > the .deb unit's TimeoutStopSec=35: the daemon drains in-flight requests
    # and finishes in-progress snapshot work before exiting.
    stop_grace_period: 40s

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://${ACU_ADMIN_PROBE:-127.0.0.1:6789}/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
