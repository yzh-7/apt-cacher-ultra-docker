# /etc/apt/apt.conf.d/99-acu-proxy
#
# Keep real hostnames in sources.list and point apt at the cache.
# Do not write the cache host into sources.list: apt then sends origin-form
# requests (GET /ubuntu/... with Host: <cache>), the daemon cannot derive an
# upstream from that, and you get "400 Bad Request" with outcome=bad in the log.

Acquire::http::Proxy "http://CACHE_HOST:3142";

# HTTPS sources only go through the cache once every client trusts the cache CA.
# Until then keep them direct, otherwise you get "The certificate issuer is unknown".
Acquire::https::Proxy "DIRECT";

# Per-host exceptions, e.g. keep one repository off the cache:
# Acquire::http::Proxy::download.example.com "DIRECT";
